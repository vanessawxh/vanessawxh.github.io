<div class="ascii-strip-wrap top"><div class="ascii-strip" data-pattern="sparkle"></div></div>

<div class="contact-wrap">
  <div class="contact-copy reveal">
    <span class="eyebrow">Get in touch</span>
    <h1 class="glitch-scramble">feel free to reach out!</h1>
    <p style="max-width:44ch; color:rgba(11,31,58,0.8);">""</p>
    <ul class="contact-list">
      <li><span>Email</span><a href="mailto:vanessaw@berkeley.edu">vanessaw@berkeley.edu</a></li>
      <li><span>LinkedIn</span><a href="https://linkedin.com/in/vanessaryanwu" target="_blank" rel="noopener">linkedin.com/in/vanessaryanwu</a></li>
      <li><span>Location</span><a href="#" style="pointer-events:none;">Berkeley, CA</a></li>
    </ul>
  </div>

  <div class="contact-form reveal">
    <span class="eyebrow" style="margin-bottom:1.5rem; display:block;">Send a message</span>
    <form action="mailto:vanessaw@berkeley.edu" method="post" enctype="text/plain">
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn inverse">Send Message <span class="arrow">→</span></button>
      
    </form>
  </div>
</div>

<script src="js/main.js"></script>
